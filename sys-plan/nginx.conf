server {
    listen 80;

    # Permitir la subida de archivos grandes (como ZIPs con múltiples PDFs)
    client_max_body_size 100M;

    # Frontend de React
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy para el Backend (FastAPI)
    location /api/ {
        # Usar el resolver de Docker para resolución dinámica de DNS
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $upstream http://fastapi-api:8001;

        # Rewrite necesario: con variables en proxy_pass, nginx NO elimina
        # el prefijo /api/ automáticamente. Esta regla lo hace manualmente.
        rewrite ^/api/(.*) /$1 break;

        proxy_pass $upstream$uri$is_args$args;

        # Pasar los headers reales para que FastAPI sepa quién hace la petición
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extender timeouts para cargas pesadas y procesamiento de ZIPs curriculares
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }
}
