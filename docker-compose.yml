services:
  planning-db:
    image: postgres:16-alpine
    container_name: planning_db
    environment:
      POSTGRES_DB: planning_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      sh -c "
        if [ -f /var/lib/postgresql/data/pg_hba.conf ]; then
          sed -i 's/hostssl\b/host/g' /var/lib/postgresql/data/pg_hba.conf;
          echo 'pg_hba.conf: hostssl -> host (SSL disabled)';
        fi;
        exec postgres -c ssl=off
      "
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d planning_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dokploy-network

  django-admin:
    build:
      context: ./sys-core
      dockerfile: Dockerfile.django
    entrypoint: [ "sh", "/app/entrypoint-django.sh" ]
    container_name: planning_django
    environment:
      DB_NAME: planning_db
      DB_USER: user
      DB_PASSWORD: password
      DB_HOST: planning-db
      DB_PORT: 5432
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-fallback}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,django-admin"
      SECRET_KEY: ${SECRET_KEY:-super_secret_key_shared_with_frontend}
    depends_on:
      planning-db:
        condition: service_healthy
    #ports:
    #  - "8000:8000"
    networks:
      - dokploy-network
    command: [ "/app/entrypoint-django.sh" ]

  fastapi-api:
    build:
      context: ./sys-core
      dockerfile: Dockerfile.fastapi
    entrypoint: [ "sh", "/app/entrypoint-fastapi.sh" ]
    container_name: planning_fastapi
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://user:password@planning-db:5432/planning_db}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql://user:password@planning-db:5432/planning_db}
      SECRET_KEY: ${SECRET_KEY:-super_secret_key_shared_with_frontend}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_HOST: planning-db
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:5173,http://localhost:80}
    depends_on:
      django-admin:
        condition: service_started
    #ports:
    #  - "8001:8001"
    networks:
      - dokploy-network

  frontend:
    build:
      context: ./sys-plan
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8009}
    container_name: planning_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8009}
    #ports:
    #  - "80:80"
    networks:
      - dokploy-network
    depends_on:
      - fastapi-api

  syllabus-service:
    build:
      context: ./sys-syllabus
      dockerfile: Dockerfile
    entrypoint: [ "sh", "/app/entrypoint-syllabus.sh" ]
    container_name: planning_syllabus
    volumes:
      - syllabus_pdfs_data:/app/syllabus_pdfs
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://user:password@planning-db:5432/planning_db}
      SECRET_KEY: ${SECRET_KEY:-super_secret_key_shared_with_frontend}
      ALGORITHM: ${ALGORITHM:-HS256}
    depends_on:
      planning-db:
        condition: service_healthy
    networks:
      - dokploy-network

volumes:
  postgres_data:
  syllabus_pdfs_data:

networks:
  dokploy-network:
    external: true
