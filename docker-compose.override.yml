services:
  frontend:
    ports:
      - "80:80"  # Esto permite que entres por localhost en Windows
    build:
      context: ./sys-plan
      args:
        VITE_API_URL: "http://localhost:8009"
    environment:
      VITE_API_URL: "http://localhost:8009"
    volumes:
      - ./sys-plan:/app
      - /app/node_modules

  django-admin:
    ports:
      - "8000:8000" # Para entrar al admin de Django en local
    volumes:
      - ./sys-core:/app

  fastapi-api:
    ports:
      - "8009:8001" # Para probar el API en local
    environment:
      ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1,http://localhost:80,http://localhost:5173"
      APP_ENV: local
      ENABLE_DOCS: "true"
      DISABLE_RATE_LIMIT: "true"
    volumes:
      - ./sys-core:/app

  syllabus-service:
    ports:
      - "8002:8002"
    environment:
      APP_ENV: local
      ENABLE_DOCS: "true"
    volumes:
      - ./sys-syllabus:/app
      - ./sys-core/syllabus_pdfs:/app/syllabus_pdfs

networks:
  dokploy-network:
    external: false # En Windows, Docker creará la red automáticamente